name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Lint levels live in `[workspace.lints]` in the root Cargo.toml so local and
  # CI runs agree; don't add a blanket RUSTFLAGS here.
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # This job executes repository code (cargo build/test); don't persist
          # the token in git config.
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-targets --all-features

      - name: Test
        run: cargo test --all-features

      - name: Test default features
        run: cargo test

      # `tinystoragedrivers-core` defines the ports every driver and consumer
      # compiles against. A database library arriving there transitively would
      # force SQLite or MongoDB onto every host, so it is asserted rather than
      # documented. The FORWARD form is required: `cargo tree -i <crate> -p
      # <pkg>` discards the `-p` scope and exits 0 looking clean.
      - name: Assert the core crate stays driver-free
        run: |
          set -euo pipefail
          forbidden="$(cargo tree -p tinystoragedrivers-core --all-features -e normal,build --prefix none \
            | grep -Ei 'rusqlite|libsqlite3|mongodb|bson|reqwest|hyper' || true)"
          if [ -n "$forbidden" ]; then
            echo "tinystoragedrivers-core pulled in a dependency its manifest forbids:" >&2
            echo "$forbidden" >&2
            echo >&2
            echo "The ports must stay free of database clients and transports;" >&2
            echo "drivers live in their own crates." >&2
            exit 1
          fi

      - name: Require 90% line coverage in every source file
        run: .github/scripts/check-file-coverage.sh 90 coverage.json

      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-json
          path: coverage.json
          if-no-files-found: ignore

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # `rust-version` is inherited from `[workspace.package]`, so every member
      # reports the same value. Read it off the package the module ships as
      # rather than off `packages[0]`, whose order cargo does not promise.
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          msrv="$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "tinystoragedrivers") | .rust_version')"
          if [[ -z "$msrv" || "$msrv" == "null" ]]; then
            echo "workspace.package.rust-version is not set in Cargo.toml" >&2
            exit 1
          fi
          echo "version=$msrv" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - name: Build with the declared MSRV
        run: cargo build --all-targets --all-features

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all
